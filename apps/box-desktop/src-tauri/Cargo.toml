[package]
name = "box-desktop"
version = "0.1.0"
description = "box.md desktop application"
edition = "2021"

[lib]
name = "box_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
box-document-store = { path = "../../../crates/document-store" }
tauri = { version = "2", features = ["unstable"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

uuid = { version = "1", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
getrandom = "=0.4.3"
workbench-desktop-client = { path = "../../../vendor/agentic-workspace/crates/workbench-desktop-client" }
local-mcp-server = { path = "../../../vendor/agentic-workspace/crates/local-mcp-server" }
pulldown-cmark = { version = "=0.13.4", default-features = false }
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKWebView", "WKNavigation"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
