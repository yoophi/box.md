[package]
name = "box-document-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Document contracts and capability-scoped filesystem storage"

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
